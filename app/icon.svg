<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Multi-Tone Copilot Ribbon Gradient -->
    <linearGradient id="copilot-ribbon" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="20%" stop-color="#3B82F6" />
      <stop offset="45%" stop-color="#6366F1" />
      <stop offset="55%" stop-color="#00F2FE" />
      <stop offset="78%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Visor Arc Gradient -->
    <linearGradient id="visor-arc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#D946EF" stop-opacity="0.8" />
    </linearGradient>

    <!-- Center Agent Core Glow -->
    <radialGradient id="agent-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#67E8F9" />
      <stop offset="70%" stop-color="#06B6D4" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>

    <!-- Ambient Core Glow behind Star -->
    <radialGradient id="ambient-star-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter for Floating M in Browser Tab -->
    <filter id="tab-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#00F2FE" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Ambient Glow behind Star (Transparent outside) -->
  <circle cx="32" cy="27" r="16" fill="url(#ambient-star-glow)" />

  <g filter="url(#tab-glow)">
    <!-- Agent Copilot Visor Bridge -->
    <path
      d="M14 36C19 41.5 25 43 32 43C39 43 45 41.5 50 36"
      fill="none"
      stroke="url(#visor-arc)"
      stroke-width="2.8"
      stroke-linecap="round"
    />

    <!-- Upper Agent Brow Line -->
    <path
      d="M18 19C22 22 27 23.5 32 23.5C37 23.5 42 22 46 19"
      fill="none"
      stroke="#67E8F9"
      stroke-opacity="0.6"
      stroke-width="1.8"
      stroke-linecap="round"
    />

    <!-- Mirai Copilot "M" Main Continuous Ribbon -->
    <path
      d="M10 52V18C10 13.5 14.5 12 17.5 15.5L32 34L46.5 15.5C49.5 12 54 13.5 54 18V52"
      fill="none"
      stroke="url(#copilot-ribbon)"
      stroke-width="6.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Inner Ribbon Highlight Line for 3D Copilot Gloss -->
    <path
      d="M10 48V20C10 16.5 12.5 15.5 14.5 17.5L29.5 35M54 48V20C54 16.5 51.5 15.5 49.5 17.5L34.5 35"
      fill="none"
      stroke="#FFFFFF"
      stroke-opacity="0.4"
      stroke-width="1.4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Central Agent Core (Neural AI Sparkle) -->
    <circle cx="32" cy="26" r="6.5" fill="url(#agent-core-glow)" />

    <!-- 4-Point Mirai Star -->
    <path
      d="M32 18C32 22.5 28 26 23.5 26C28 26 32 29.5 32 34C32 29.5 36 26 40.5 26C36 26 32 22.5 32 18Z"
      fill="#FFFFFF"
    />
  </g>
</svg>
