<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="p-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C18" />
      <stop offset="50%" stop-color="#0D1326" />
      <stop offset="100%" stop-color="#050711" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="p-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.9" />
    </linearGradient>

    <!-- Flight Wing Ribbon Gradient -->
    <linearGradient id="p-ribbon" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="25%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="75%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Radar Orbit Arc Gradient -->
    <linearGradient id="p-radar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#D946EF" stop-opacity="0.8" />
    </linearGradient>

    <!-- Core Glow -->
    <radialGradient id="p-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#67E8F9" />
      <stop offset="75%" stop-color="#06B6D4" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow -->
    <filter id="p-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#00F2FE" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Dark Rounded App Icon Badge -->
  <rect width="64" height="64" rx="16" fill="url(#p-bg)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="url(#p-border)" stroke-width="1.5" />

  <g filter="url(#p-shadow)">
    <!-- Radar Orbit Ellipse -->
    <ellipse
      cx="32"
      cy="32"
      rx="22"
      ry="10"
      transform="rotate(-22 32 32)"
      fill="none"
      stroke="url(#p-radar)"
      stroke-width="2"
      stroke-dasharray="4 2"
    />

    <!-- InterviewPilot Delta Flight Chevron -->
    <path
      d="M14 46L32 13L50 46L32 36Z"
      fill="url(#p-ribbon)"
      stroke="url(#p-border)"
      stroke-width="1.5"
      stroke-linejoin="round"
    />

    <!-- Left Wing Specular Reflection -->
    <path
      d="M32 13L14 46L32 36V13Z"
      fill="#FFFFFF"
      fill-opacity="0.22"
    />

    <!-- Central Neural Pilot Core -->
    <circle cx="32" cy="27" r="6" fill="url(#p-core)" />

    <!-- 4-Point AI Guidance Star -->
    <path
      d="M32 20C32 24.2 28.8 27 25 27C28.8 27 32 29.8 32 34C32 29.8 35.2 27 39 27C35.2 27 32 24.2 32 20Z"
      fill="#FFFFFF"
    />
  </g>
</svg>
